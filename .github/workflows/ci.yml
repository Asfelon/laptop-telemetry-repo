name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write  # For code scanning SARIF upload

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv sync --extra windows --dev
          else
            uv sync --dev
          fi
        shell: bash

      - name: Run Ruff (lint)
        run: uv run --with ruff ruff check src/ tests/

      - name: Run Ruff (format check)
        run: uv run --with ruff ruff format --check src/ tests/

      - name: Run MyPy
        run: uv run --with mypy mypy src/

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Windows is primary platform - test all versions
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv sync --extra windows --dev
          else
            uv sync --dev
          fi
        shell: bash

      - name: Run tests
        run: uv run --with pytest --with pytest-cov pytest --cov=src --cov-report=xml --cov-report=term-missing
        env:
          # Windows-specific: some collectors need admin, skip in CI
          LAPTOP_TELEMETRY_COLLECTORS_THERMAL_ENABLED: "false"
          LAPTOP_TELEMETRY_COLLECTORS_FAN_ENABLED: "false"
          LAPTOP_TELEMETRY_COLLECTORS_VOLTAGE_ENABLED: "false"
          LAPTOP_TELEMETRY_COLLECTORS_GPU_ENABLED: "false"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv sync --extra windows --dev
          else
            uv sync --dev
          fi
        shell: bash

      - name: Build package
        run: uv build

      - name: Verify package
        run: |
          uv run twine check dist/*
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7